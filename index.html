<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logos/Favicon/favicon_32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logos/Favicon/favicon_16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/Favicon/favicon_180.png" />

    <!-- Primary meta -->
    <title>Narom Group — Distribuidor mayorista para ferreterías</title>
    <meta name="description" content="Distribuidor mayorista de herramientas, pinturas y sanitarios. INGCO, MOTA, SANIPLAST y TODO PINTURAS para ferreterías en Argentina." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web-narom.vercel.app/" />
    <meta property="og:title" content="Narom Group — Distribuidor mayorista para ferreterías" />
    <meta property="og:description" content="Distribuidor mayorista de herramientas, pinturas y sanitarios. INGCO, MOTA, SANIPLAST y TODO PINTURAS para ferreterías en Argentina." />
    <meta property="og:image" content="https://web-narom.vercel.app/og-image.jpg" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Narom Group" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Narom Group — Distribuidor mayorista para ferreterías" />
    <meta name="twitter:description" content="Distribuidor mayorista de herramientas, pinturas y sanitarios. INGCO, MOTA, SANIPLAST y TODO PINTURAS." />
    <meta name="twitter:image" content="https://web-narom.vercel.app/og-image.jpg" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WholesaleStore",
      "name": "Narom Group",
      "description": "Distribuidor mayorista de herramientas, pinturas y sanitarios para ferreterías. Representante oficial de INGCO, MOTA, SANIPLAST y TODO PINTURAS.",
      "url": "https://naromgroup.com",
      "logo": "https://naromgroup.com/logos/PNG/Logo_Horizontal_Positivo_Narom_Group.png",
      "image": "https://naromgroup.com/og-image.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mendoza",
        "addressCountry": "AR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "availableLanguage": "Spanish"
      },
      "sameAs": [],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Catálogo de productos",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Product", "brand": "INGCO", "category": "Herramientas eléctricas y manuales" } },
          { "@type": "Offer", "itemOffered": { "@type": "Product", "brand": "MOTA", "category": "Herramientas manuales" } },
          { "@type": "Offer", "itemOffered": { "@type": "Product", "brand": "SANIPLAST", "category": "Sanitarios y plomería" } },
          { "@type": "Offer", "itemOffered": { "@type": "Product", "brand": "TODO PINTURAS", "category": "Pinturas y revestimientos" } }
        ]
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
